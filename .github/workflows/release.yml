name: release

# Tag-triggered Android pre-release: build the arm64 release APK from the
# committed engine blob (jniLibs) and attach it to a GitHub pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK (arm64)
        working-directory: app/ui
        env:
          GOPROXY: https://goproxy.cn,direct
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Create pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/ui/build/app/outputs/flutter-apk/app-release.apk \
            --title "$GITHUB_REF_NAME (Android pre-release)" \
            --notes "Embedded Go engine + Flutter shell. Seed: 30,878 books. Install the arm64 APK on Android 8+." \
            --prerelease
