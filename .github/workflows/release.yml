name: release

# Tag-triggered Android pre-release: build libstrata.so with the NDK, build
# the arm64 release APK, and attach it to a GitHub pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: app/engine/go.sum

      # android-actions/setup-android@v3 failed on the current ubuntu-latest
      # (2026-11-19: two consecutive runs died in its SDK bootstrap step),
      # so install the command-line tools manually from the stable Google
      # URL. The runner user cannot write /usr/local (Permission denied),
      # so install under $HOME.
      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Install Android NDK + platforms
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;28.2.13676358" "platform-tools" \
            "platforms;android-35" "platforms;android-36" \
            "build-tools;35.0.0" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build libstrata.so (arm64)
        working-directory: app/engine
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          mkdir -p ../ui/android/app/src/main/jniLibs/arm64-v8a
          CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$CC" \
            go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
            -o ../ui/android/app/src/main/jniLibs/arm64-v8a/libstrata.so ./cmd/ffi
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h ../ui/android/app/src/main/jniLibs/arm64-v8a/libstrata.so | grep AArch64
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            -D ../ui/android/app/src/main/jniLibs/arm64-v8a/libstrata.so | grep strata_start

      - name: Verify bundled seed assets
        run: |
          test -s app/ui/assets/manifest.json
          test -s app/ui/assets/seed.db.gz
          python3 - <<'PY'
          import gzip, hashlib, json, sqlite3, tempfile
          from pathlib import Path

          manifest = json.loads(Path("app/ui/assets/manifest.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] >= 2, manifest["schema_version"]
          gz = Path("app/ui/assets/seed.db.gz").read_bytes()
          db = gzip.decompress(gz)
          assert len(db) == manifest["files"]["db"]["bytes"], "seed.db size mismatch"
          assert hashlib.sha256(db).hexdigest() == manifest["files"]["db"]["sha256"], "seed.db hash mismatch"
          with tempfile.NamedTemporaryFile(suffix=".db") as fh:
              fh.write(db)
              fh.flush()
              conn = sqlite3.connect(fh.name)
              rows = conn.execute("SELECT COUNT(*) FROM deep_ranks").fetchone()[0]
              meta = dict(conn.execute("SELECT key, value FROM seed_meta"))
              conn.close()
          assert rows == 14626, rows
          assert meta["seed_version"] == manifest["seed_version"], meta["seed_version"]
          print(f"seed {meta['seed_version']}: books={meta['book_count']} deep_ranks={rows}")
          PY

      - name: Build release APK (arm64)
        working-directory: app/ui
        run: |
          flutter pub get
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build_log.txt
          status=$?
          if [ $status -ne 0 ]; then
            {
              echo "### build log tail"
              echo '```'
              tail -120 build_log.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
          fi

      - name: Verify release APK
        run: |
          APK=app/ui/build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstrata.so'
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | grep 'android.permission.INTERNET'

      - name: Dump failure log into the repo
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "noreply@users.noreply.github.com"
          tail -200 app/ui/build_log.txt > ci-failure.log || true
          git add -f ci-failure.log
          git commit -m "ci: failure log [skip ci]" || true
          git push || true

      - name: Create pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/ui/build/app/outputs/flutter-apk/app-release.apk \
            --title "$GITHUB_REF_NAME (Android pre-release)" \
            --notes "Embedded Go engine + Flutter shell. Seed: 18,105 books (V3, 47 licensed included). Install the arm64 APK on Android 8+." \
            --prerelease
