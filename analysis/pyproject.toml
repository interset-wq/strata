[project]
name = "strata-analysis"
version = "0.1.0"
description = "SF 轻小说（菠萝包）书目数据规范化与可复现分析管线：19 份报告与 82 张图的生成器"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "jieba>=0.42.1",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "requests>=2.34",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "wordcloud>=1.9.6",
]

[project.optional-dependencies]
# 仅在需要重新解压 dataset.7z 时需要
archive = ["py7zr>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]
