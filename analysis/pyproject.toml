[project]
name = "strata-analysis"
version = "0.1.0"
description = "novel_hub v0.0.1 → 规范化 CSV + 约束 DDL"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "requests>=2.34",
]

[project.optional-dependencies]
# 仅在需要重新解压 dataset.7z 时需要
archive = ["py7zr>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]
