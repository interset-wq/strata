[project]
name = "quarry"
version = "0.1.0"
description = "SFACG 书目数据勘测：把每条结论变成可重算、可断言的产物"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
